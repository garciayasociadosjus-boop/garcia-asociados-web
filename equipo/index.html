<!DOCTYPE html>
<html lang="es-AR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de expedientes — Equipo</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 350 350'><circle cx='175' cy='40' r='14' fill='%23d4a017' stroke='%231a1a2e' stroke-width='3'/><circle cx='175' cy='40' r='7' fill='%23f0c040'/><rect x='168' y='40' width='16' height='280' rx='8' fill='%231a1a2e'/><rect x='25' y='48' width='300' height='14' rx='7' fill='%231a1a2e'/><rect x='110' y='308' width='130' height='14' rx='7' fill='%231a1a2e'/><rect x='130' y='295' width='90' height='15' rx='5' fill='%232d2d44'/><line x1='35' y1='58' x2='15' y2='185' stroke='%231a1a2e' stroke-width='3'/><line x1='35' y1='58' x2='55' y2='185' stroke='%231a1a2e' stroke-width='3'/><line x1='315' y1='58' x2='295' y2='185' stroke='%231a1a2e' stroke-width='3'/><line x1='315' y1='58' x2='335' y2='185' stroke='%231a1a2e' stroke-width='3'/><ellipse cx='35' cy='198' rx='55' ry='12' fill='%23a07010'/><ellipse cx='35' cy='190' rx='55' ry='12' fill='%23d4a017' stroke='%231a1a2e' stroke-width='3'/><ellipse cx='35' cy='187' rx='45' ry='6' fill='none' stroke='%23f0c040' stroke-width='1.5'/><ellipse cx='315' cy='198' rx='55' ry='12' fill='%23a07010'/><ellipse cx='315' cy='190' rx='55' ry='12' fill='%23d4a017' stroke='%231a1a2e' stroke-width='3'/><ellipse cx='315' cy='187' rx='45' ry='6' fill='none' stroke='%23f0c040' stroke-width='1.5'/></svg>">
    <style>
        :root {
            --primary: #05080F; --gold: #D4AF37; --text: #131A2B;
            --champagne: #F9F9F7; --borde: #E3E1DA; --white: #FFFFFF;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 2rem 1.25rem;
            font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
            background: var(--champagne); color: var(--text); line-height: 1.65;
        }
        .caja { max-width: 720px; margin: 0 auto; }
        h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
        .sub { color: #6B7280; margin: 0 0 2rem; font-size: .95rem; }
        .panel {
            background: var(--white); border: 1px solid var(--borde);
            border-left: 4px solid var(--gold); border-radius: 10px; padding: 1.5rem;
        }
        label {
            display: block; font-size: .78rem; text-transform: uppercase;
            letter-spacing: .06em; color: #6B7280; margin-bottom: .4rem;
        }
        input {
            width: 100%; padding: 14px 16px; font-size: 1.05rem; font-family: inherit;
            border: 1px solid var(--borde); border-radius: 8px;
            background: var(--champagne); color: var(--text);
        }
        input:focus { outline: 2px solid var(--gold); outline-offset: 1px; background: var(--white); }
        button {
            padding: 14px 28px; font-family: inherit; font-size: .95rem; font-weight: 600;
            color: var(--primary); background: var(--gold); border: none;
            border-radius: 8px; cursor: pointer;
        }
        button:disabled { opacity: .6; cursor: default; }
        .fila { display: flex; flex-wrap: wrap; gap: .75rem; align-items: flex-end; margin-top: 1rem; }
        .fila > div { flex: 1 1 220px; min-width: 0; }
        .ayuda { font-size: .85rem; color: #6B7280; margin: .6rem 0 0; }
        .salida { display: none; }
        .salida.visible {
            display: block; margin-top: 1.5rem; padding: 1.25rem; border-radius: 8px;
            background: var(--champagne); border: 1px solid var(--borde);
            white-space: pre-wrap; overflow-wrap: anywhere;
        }
        .salida.aviso { background: #FEF6E7; border-color: #E8C77B; }
        .salida.cargando { color: #6B7280; font-style: italic; }
        .pie {
            margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid var(--borde);
            font-size: .85rem; color: #6B7280; display: flex; justify-content: space-between;
            align-items: center; gap: 1rem; flex-wrap: wrap;
        }
        .salir {
            background: none; border: none; color: #6B7280; text-decoration: underline;
            cursor: pointer; padding: 0; font-size: .85rem; font-family: inherit; font-weight: 400;
        }
        @media (max-width: 560px) { .fila > div, .fila button { flex: 1 1 100%; } button { width: 100%; } }
    </style>
</head>
<body>
    <div class="caja">
        <h1>Consulta de expedientes</h1>
        <p class="sub">Uso interno del Estudio García &amp; Asociados</p>

        <div class="panel">
            <div id="pedirClave">
                <label for="clave">Clave del equipo</label>
                <input id="clave" type="password" autocomplete="current-password"
                       placeholder="La clave que le dio el estudio">
                <div class="fila"><button id="btnEntrar" type="button">Entrar</button></div>
                <p class="ayuda">Queda guardada en este navegador: la escribe una sola vez.
                   No la use en una computadora compartida.</p>
            </div>

            <div id="consulta" style="display:none">
                <form id="formConsulta">
                    <label for="dni">Número de documento</label>
                    <div class="fila">
                        <div><input id="dni" type="text" inputmode="numeric" autocomplete="off"
                                    placeholder="Por ejemplo 28456789"></div>
                        <button type="submit" id="btnBuscar">Buscar</button>
                    </div>
                </form>
                <p class="ayuda">Sin puntos ni espacios. Busca en jurídica y en siniestros.</p>
                <div class="salida" id="salida" role="status" aria-live="polite"></div>
                <div class="pie">
                    <span>Lo que ve acá es lo mismo que ve el cliente.</span>
                    <button class="salir" type="button" id="btnSalir">Olvidar la clave en este navegador</button>
                </div>
            </div>
        </div>
    </div>

<script>
// La clave viaja en una cabecera, nunca en la dirección: una dirección queda en el
// historial, en los favoritos y en los registros de cualquier intermediario.
(function () {
    var API = 'https://garcia-ia.garciayasociadosjus.workers.dev/api/equipo/consulta';
    var GUARDADA = 'clave-equipo-gya';

    var pedir = document.getElementById('pedirClave');
    var panel = document.getElementById('consulta');
    var campoClave = document.getElementById('clave');
    var campoDni = document.getElementById('dni');
    var salida = document.getElementById('salida');
    var btnBuscar = document.getElementById('btnBuscar');

    function clave() { try { return localStorage.getItem(GUARDADA) || ''; } catch (e) { return ''; } }

    function mostrarPanel() {
        var hay = !!clave();
        pedir.style.display = hay ? 'none' : 'block';
        panel.style.display = hay ? 'block' : 'none';
        if (hay) campoDni.focus(); else campoClave.focus();
    }

    function decir(tipo, texto) {
        salida.className = 'salida visible ' + tipo;
        salida.textContent = texto;          // texto, nunca HTML
    }

    document.getElementById('btnEntrar').addEventListener('click', function () {
        var v = (campoClave.value || '').trim();
        if (!v) { campoClave.focus(); return; }
        try { localStorage.setItem(GUARDADA, v); } catch (e) {}
        campoClave.value = '';
        mostrarPanel();
    });
    campoClave.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') document.getElementById('btnEntrar').click();
    });

    document.getElementById('btnSalir').addEventListener('click', function () {
        try { localStorage.removeItem(GUARDADA); } catch (e) {}
        salida.className = 'salida';
        mostrarPanel();
    });

    document.getElementById('formConsulta').addEventListener('submit', function (ev) {
        ev.preventDefault();
        var dni = (campoDni.value || '').replace(/\D/g, '');
        if (dni.length < 7 || dni.length > 8) {
            decir('aviso', 'El documento son 7 u 8 cifras, sin puntos.');
            campoDni.focus();
            return;
        }
        btnBuscar.disabled = true;
        decir('cargando', 'Buscando…');

        fetch(API, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-Clave-Equipo': clave() },
            body: JSON.stringify({ dni: dni })
        })
        .then(function (r) { return r.text().then(function (t) { return { estado: r.status, texto: t }; }); })
        .then(function (r) {
            if (r.estado === 401) {
                // La clave dejó de servir —la cambiaron, o se tecleó mal la primera vez—:
                // se borra la guardada y se vuelve a pedir, en vez de dejar a la persona
                // reintentando contra una clave que ya no vale.
                try { localStorage.removeItem(GUARDADA); } catch (e) {}
                mostrarPanel();
                decir('aviso', 'La clave no es correcta. Escribila de nuevo.');
                return;
            }
            decir(r.estado === 200 ? 'ok' : 'aviso', r.texto);
        })
        .catch(function () {
            decir('aviso', 'No se pudo consultar. Probá de nuevo en un rato.');
        })
        .then(function () { btnBuscar.disabled = false; });
    });

    mostrarPanel();
})();
</script>
</body>
</html>
